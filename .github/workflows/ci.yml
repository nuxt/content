name: ci

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - v4
  pull_request:
    branches:
      - main
      - v4

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      COREPACK_DEFAULT_TO_LATEST: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: "24"
      - run: npm i -g --force corepack && corepack enable
      - run: pnpm install
      - run: pnpm dev:prepare
      - run: pnpm lint
      - run: pnpm prepack
      - run: pnpm typecheck
      # The hybrid example tests navigate in a real browser (`@nuxt/test-utils` + playwright-core).
      - run: pnpm exec playwright-core install --only-shell chromium
      # The Nitro 3 fixtures (Nuxt 5 nightly, and Nuxt 4 on Nitro 3) have their own lockfiles.
      - run: pnpm install --dir test/fixtures/nuxt5 && pnpm install --dir test/fixtures/nuxt4-nitro3
      # Each example test boots a full Nuxt app. On the GitHub runner Node 24
      # caps the V8 heap near 2GB (it reads the cgroup memory limit), so the
      # heavier ones (ui, i18n) die with "Ineffective mark-compacts near heap
      # limit" once the heap crosses ~2GB. Give the test step a larger heap,
      # and build one app at a time: workers inherit NODE_OPTIONS, so letting
      # several of these builds run in parallel would oversubscribe the runner.
      - run: pnpm exec vitest run --maxWorkers 1 --no-file-parallelism
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Publish
        run: pnpx pkg-pr-new publish --compact --no-template --pnpm
