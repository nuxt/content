packages:
  - ./
  - playground
  - examples/*

overrides:
  # This package is published as `@nuxt/content4`; examples and the playground
  # depend on the name `@nuxt/content`. A path link resolves there without renaming it.
  "@nuxt/content": "link:."
  # postcss-merge-rules@9.1 uses `sameContainer`, added in cssnano-utils@8.2.0, but declares ^8.1.0
  "postcss-merge-rules@9>cssnano-utils": ^8.2.0
  # `external-links` plugin from comarkdown/comark#599, until it's released. One copy for every dependent.
  comark: https://pkg.pr.new/comark@0b5d53f

# The `comark` override above is a URL, which pnpm blocks below the top level. Remove both once comark is released.
blockExoticSubdeps: false

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - "@nuxt/cli@4.0.0"
  - "@nuxt/kit@4.6.0 || 4.7.0"
  - "@nuxt/nitro-server@4.6.0 || 4.7.0"
  - "@nuxt/schema@4.6.0 || 4.7.0"
  - "@nuxt/vite-builder@4.6.0 || 4.7.0"
  - "@nuxt/vite-server@4.6.0 || 4.7.0"
  - nuxt@4.6.0 || 4.7.0
  - cssnano-utils@8.2.0
  - "@comark/vue@0.9.1"
  - comark@0.9.1
  - comark-content@0.6.0
  - "@nuxt/test-utils@4.4.0"
  - "@nuxt/nitro-v3-server@4.7.0"
  - nitropack@2.14.0
