packages:
  - ./
  - playground
  - docs
  - examples/*
  - test/fixtures/*

shamefullyHoist: true

overrides:
  "@nuxt/content": workspace:*
  "@unhead/vue": ^3.1.8
  unhead: ^3.1.8
  "undici@>=7.0.0 <7.29.1": ^7.30.1
  "undici@>=6.0.0 <6.29.1": ^6.29.1
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
  "sharp@<0.35.5": ^0.35.5
  # Dependabot: GHSA-qv5m-9pm6-hqp3, GHSA-jpvv-r467-5p4w, GHSA-46wx-v44x-9hh2, GHSA-4h7h-rv7c-7m2v, GHSA-4m76-xfj5-7975, GHSA-h7mg-cq63-vhpq, GHSA-3gg2-335m-rxc6
  "@hono/node-server@>=2.0.0 <2.1.6": ^2.1.6
  "hono@<4.13.16": ^4.13.16
  # Dependabot: GHSA-27r3-jxmh-p828, GHSA-6pq8-jhm2-2vcw, GHSA-w74x-v4r6-6crp, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  "qs@>=6.7.0 <=6.16.0": ^6.16.1
  "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
  # Dependabot: GHSA-474x-hrwr-fgx4, GHSA-m5mm-p8h7-m29v, GHSA-5pm8-86m8-9m6r, GHSA-g3hv-75wg-m249
  "fast-xml-parser@<=5.11.2": ^5.12.0
  "serialize-javascript@<7.1.3": ^7.1.3
  "basic-ftp@<=6.2.3": ^6.2.4
  # minimatch 11 drops makeRe(), which eslint-plugin-import-x@4.17.1 imports at config load.
  # 4.18.1 uses Minimatch#match instead, so the security override can stay on 11.x.
  "minimatch@>=7.0.0 <11": 11.0.8
  "eslint-plugin-import-x@<4.18.1": ^4.18.1
  # Dependabot: node-forge GHSAs patched in 1.4.3 (including GHSA-86w9-cpqp-85rv, still reported as <=1.4.0)
  "node-forge@<=1.4.2": ^1.4.3

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - "@nuxtjs/mdc@0.22.1"
  - remark-mdc@3.11.1
  - miniflare@5.20260825.0-alpha || 5.20260826.0-alpha || 5.20260921.0-alpha || 5.20261006.0-alpha || 5.20261019.1-beta || 5.20261110.2-beta
  - wrangler@4.126.0 || 4.127.0 || 4.136.0 || 4.148.0 || 4.151.3 || 4.161.0
  - '@types/node@26.4.0'
  - happy-dom@20.11.9 || 20.11.10
  - '@cloudflare/workers-types@5.20260827.1 || 5.20260921.1 || 5.20261007.1 || 5.20261113.1'
  - '@cloudflare/workerd-darwin-64@1.20260921.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260921.1'
  - '@cloudflare/workerd-linux-64@1.20260921.1'
  - '@cloudflare/workerd-linux-arm64@1.20260921.1'
  - '@cloudflare/workerd-windows-64@1.20260921.1'
  - workerd@1.20260921.1
  - mdast-util-to-hast@13.2.2
  - nuxt-llms@0.3.2
  - nuxt-studio@1.8.1
