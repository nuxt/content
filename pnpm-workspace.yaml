packages:
  - ./
  - playground
  - examples/*

overrides:
  "@nuxt/content": workspace:*
  # postcss-merge-rules@9.1 uses `sameContainer`, added in cssnano-utils@8.2.0, but declares ^8.1.0
  "postcss-merge-rules@9>cssnano-utils": ^8.2.0

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - "@nuxt/cli@4.0.0"
  - "@nuxt/kit@4.6.0"
  - "@nuxt/nitro-server@4.6.0"
  - "@nuxt/schema@4.6.0"
  - "@nuxt/vite-builder@4.6.0"
  - "@nuxt/vite-server@4.6.0"
  - nuxt@4.6.0
  - cssnano-utils@8.2.0

patchedDependencies:
  comark-content@0.4.1: patches/comark-content@0.4.1.patch
